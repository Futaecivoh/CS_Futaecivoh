repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: detect-private-key
-   repo: local
    hooks:
    -   id: pip-audit
        name: pip-audit
        entry: pip-audit -r
        language: system
        files: requirements.txt
